# Render Blueprint for the API. In Render: New > Blueprint > pick this repo; it asks for the values
# marked "sync: false" (paste them from Backend/.env.example's list). The Vercel frontend is separate.
services:
  - type: web
    name: blood-donated-api
    runtime: node
    rootDir: Backend
    plan: free                    # free instances sleep after ~15 min idle; upgrade for always-on
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /            # answers {"status":"ok"} without touching the database
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI            # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true       # Render creates a strong random value
      - key: QR_JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL          # the first admin account, created on first start
        sync: false
      - key: ADMIN_PASSWORD_HASH  # bcrypt hash — see Backend/scripts/generate-secrets.js
        sync: false
      - key: FRONTEND_URL         # your Vercel address(es), comma-separated; "*" wildcards allowed
        sync: false
      - key: ANTHROPIC_API_KEY    # optional: without a real key the assistant answers offline
        sync: false
    # Uploaded photos are written to Backend/uploads. On the free plan that disk is wiped whenever the
    # service restarts or sleeps. To keep them, use a paid plan and uncomment:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/Backend/uploads
    #   sizeGB: 1
